name: ButterKeys
options:
  bundleIdPrefix: com.timbeniks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
attributes:
  LastUpgradeCheck: "2600"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  ButterKeysCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ButterKeysCore
    resources:
      - path: Resources/DefaultRules.json
      - path: Resources/Dictionary
      - path: Resources/PhraseData
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbeniks.ButterKeysCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        DEVELOPMENT_TEAM: U72ZU3UVH6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
  ButterKeys:
    type: application
    platform: macOS
    sources:
      - path: Sources/ButterKeys
    resources:
      - path: Sources/ButterKeys/Resources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: ButterKeysCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbeniks.ButterKeys
        PRODUCT_NAME: ButterKeys
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ButterKeys.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: U72ZU3UVH6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle feed — override SPARKLE_FEED_URL / SPARKLE_PUBLIC_ED_KEY via xcconfig or env.
        SPARKLE_FEED_URL: "https://github.com/timbenniks/butterkeys/releases/latest/download/appcast.xml"
        SPARKLE_PUBLIC_ED_KEY: "NotA0yjssTvsM8xfRPRVU3wOEMjtnEdv4zPZFh1AF+k="
        INFOPLIST_KEY_SUFeedURL: "$(SPARKLE_FEED_URL)"
  ButterKeysTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ButterKeysTests
    dependencies:
      - target: ButterKeysCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timbeniks.ButterKeysTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ButterKeys:
    build:
      targets:
        ButterKeys: all
        ButterKeysCore: all
        ButterKeysTests: [test]
    test:
      targets:
        - ButterKeysTests
    run:
      config: Debug
    archive:
      config: Release
